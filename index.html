<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Promedios UCV</title>
    <link rel="stylesheet" href="styles.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="ruta/a/tu/logo-ucv.png" alt="Logo UCV" class="logo-ucv">
            <h1 class="title">Calculadora de Promedios <span class="highlight">UCV</span></h1>
            <p class="subtitle">Ingeniería / Arquitectura</p>
        </header>

        <main class="calculator-card">
            <p class="docente-info">Diseñada por el Docente: **Ing. Anthony R. Chilet Leiva**</p>
            
            <div class="button-group">
                <button class="calculate-button" onclick="calcularPromedio()">Calcular Promedio Final</button>
                <button class="clear-button" onclick="limpiarCampos()">🗑️ Limpiar Notas</button>
            </div>
            <section class="results-section">
                <h2>📈 Resultados Finales</h2>
                <div class="results-grid">
                    <div class="result-box">
                        <p class="result-label">Promedio Módulo 2 (M2)</p>
                        <p id="resultadoM2" class="result-value">0.00</p>
                    </div>
                    <div class="result-box final">
                        <p class="result-label">Promedio Final (PF)</p>
                        <p id="resultadoPF" class="result-value final-value">0</p>
                    </div>
                </div>
                <p id="estadoAprobacion" class="status-message"></p>
                <div id="mensajeAyuda"></div> 
            </section>
        </main>
        
        <footer>
            <p>Simulador de Notas con fines académicos. Consulta la normatividad oficial de la UCV.</p>
        </footer>
    </div>
    <script src="script.js"></script> 
</body>
</html>
